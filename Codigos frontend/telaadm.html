<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Cadastro de Mercadoria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <div class="div">
                <h1>MercadoFinder</h1>
            </div>
            <button><a href="indexmercado.html">Home</a></button>
            <button type="button"><a href="login.html">Entrar</a></button>
        </nav>
    </header>

    <h1 class="cadastoadm">Cadastro de mercadoria</h1>
    <form id="mercadoriaForm">
        <input type="text" id="nomeproduto" placeholder="Nome da mercadoria" name="txtNome" required>
        <input type="text" id="quant" placeholder="Quantidade do produto" name="txtQuant" required>
        <input type="text" id="cate" placeholder="Categoria" name="txtCate" required>
        <input type="text" id="mercado_nome" placeholder="Nome do mercado" name="txtMercado" required>
        <input type="number" id="precomercadoria" placeholder="Preço da mercadoria" name="txtPreco" required>
        <button type="submit" id="botaoadm">Adicionar mercadoria</button>
    </form>

    <h1 class="cadastoadm">Excluir mercadoria</h1>
    <form id="excluirProdutoForm">
        <input type="number" id="produto_id" placeholder="ID do Produto" name="produto_id" required>
        <button type="submit" id="botaoExcluir">Excluir mercadoria</button>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('mercadoriaForm').addEventListener('submit', function(event) {
                event.preventDefault(); // Prevenir o envio padrão do formulário

                // Coletar os dados do formulário
                const mercadoria = {
                    nome: document.getElementById('nomeproduto').value,
                    quantidade_estoque: document.getElementById('quant').value,
                    categoria: document.getElementById('cate').value,
                    mercado: document.getElementById('mercado_nome').value,
                    preco: document.getElementById('precomercadoria').value
                };

                // Enviar os dados para a API
                fetch('http://localhost/api_projeto/api/produto/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(mercadoria)
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Sucesso:', data);
                    alert('Mercadoria adicionada com sucesso!');
                })
                .catch((error) => {
                    console.error('Erro:', error);
                    alert('Houve um erro ao adicionar a mercadoria.');
                });
            });

            document.getElementById('excluirProdutoForm').addEventListener('submit', function(event) {
                event.preventDefault(); // Prevenir o envio padrão do formulário

                // Obter o ID do produto
                const produtoId = document.getElementById('produto_id').value;

                // Enviar solicitação DELETE para a API
                fetch(`http://localhost/api_projeto/api/produto/${produtoId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert('Produto excluído com sucesso!');
                    } else {
                        alert('Erro ao excluir o produto: ' + data.message);
                    }
                })
                .catch(error => {
                    console.eror('Erro:', error);
                    alert('Houve um erro ao excluir o produto.');
                });
            });
        });
    </script>
</body>
</html>
