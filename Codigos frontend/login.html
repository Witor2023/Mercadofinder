<!DOCTYPE html>
<html lang="pt-br">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Cad_e_Log.css">
    <title>Login</title>

  </head>

  <body class="log">
    <div class="wrapper">

    <form action="#" class="cad" method="post">
        <h1>Faça o seu login</h1>

      <div class="inp">
        <input type="email" placeholder="Digite seu e-mail" id="email" name="email" required>
        <br>
      </div>

      <div class="inp">  
        <input type="password" placeholder="Digite sua senha" id="senha" name="senha" required>
        <br>
      </div>


      <button type="button" class="btLogin">Login</button>
      <p>Não possui uma conta?</p>
      <button type="button" class="btCad"><a href="cadastro.html">Cadastre-se</a></button>
    </form>
    </div>
  </body>
</html>
