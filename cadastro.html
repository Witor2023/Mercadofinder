<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css">
    <link rel="stylesheet" href="Cad_e_Log.css">
    <title>Cadastro</title>
</head>
<body class="cad">
    <div class="wrapper">
        <form id="Cadastro" class="cad" method="post">
            <h1>Cadastro de Usuário</h1>
            <div class="inp">
                <input type="text" placeholder="Nome" id="txtNome" name="txtNome" required>
                <br>
            </div>
            <div class="inp">
                <input type="email" placeholder="Digite seu e-mail" id="txtEmail" name="txtEmail" required>
                <br>
            </div>
            <div class="inp">
                <input type="password" placeholder="Crie uma senha" id="txtSenha" name="txtSenha" required>
                <br>
            </div>
            <div class="inp">
                <input type="password" placeholder="Confirmar Senha" id="txtConfirmar_senha" name="txtConfirmar_senha" required>
                <br>
            </div>
           
            <div class="inp">
                <input type="date" id="txtData_nascimento" placeholder="Data de Nascimento" name="txtData_nascimento" required>
                <br>
            </div>
            <div class="inp">
                <input class="data" type="text" placeholder="Cidade" id="txtCidade" name="txtCidade">
                <br>
            </div>
            <div class="inp">
                <input type="text" placeholder="País" id="txtPais" name="txtPais">
                <br>
            </div>
            <button type="summit" name="btSalvar" value="Salvar" id="btCadastro" class="btCadastro">Cadastro</button>
        </form>
    </div>

    <!-- Iniciamos a programação em JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('Cadastro').addEventListener('submit', function(event) {
                event.preventDefault(); // Prevenir o envio padrão do formulário

                // Coletar os dados do formulário
                const login = {
                    nome: document.getElementById('txtNome').value,
                    email: document.getElementById('txtEmail').value,
                    senha: document.getElementById('txtSenha').value,
                    confirma_senha: document.getElementById('txtConfirmar_senha').value,
                    data_nascimento: document.getElementById('txtData_nascimento').value,
                    cidade: document.getElementById('txtCidade').value,
                    pais: document.getElementById('txtPais').value
                };

                // Enviar os dados para a API
                fetch('http://localhost/api_projeto/api/logados/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(login)
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Sucesso:', data);
                    alert('Conta Criada');
                })
                .catch((error) => {
                    console.error('Erro:', error);
                    alert('Houve um erro ao criar a conta.');
                });
            });
        });
    </script>
</body>
</html>

   cidade varchar (100),
   pais varchar(50)
)
-->
